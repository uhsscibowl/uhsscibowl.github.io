<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <style>
    body { font: 16px system-ui; padding: 1rem; color: #1b1530; }
    button { margin: .5rem .5rem .5rem 0; padding: .6rem; }
    pre { max-height: 200px; overflow: auto; padding: .75rem; background: #e7e0f4; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading preview…</p>
  <pre id="template" hidden></pre>
  <button id="copy" type="button" hidden>Select score template</button>
  <button id="publish" type="button" disabled>Publish both encrypted files</button>
  <button id="close" type="button">Close</button>
  <?!= HtmlService.createHtmlOutputFromFile('Shared').getContent(); ?>
  <script>
    const status = document.querySelector('#status');
    const template = document.querySelector('#template');
    const copy = document.querySelector('#copy');
    const publish = document.querySelector('#publish');
    const showError = error => { status.textContent = error.message; };
    document.querySelector('#close').onclick = () => google.script.host.close();
    copy.onclick = () => {
      const range = document.createRange();
      range.selectNodeContents(template);
      getSelection().removeAllRanges();
      getSelection().addRange(range);
      status.textContent = 'Template selected. Copy it for import into Scores.';
    };

    async function prepare(snapshot) {
      try {
        const data = Tournament.readStatic(snapshot.roster);
        if (!data) throw new Error('Static is unavailable');
        const rounds = Tournament.schedule(data);
        const fingerprint = await TournamentCrypto.fingerprint(Tournament.scheduleKey(data, rounds));
        if (snapshot.frozen && fingerprint !== snapshot.frozen) throw new Error('Schedule is frozen');
        template.textContent = Tournament.scoreTemplate(rounds);
        template.hidden = copy.hidden = false;
        const scoresRows = Tournament.csv(snapshot.scores).filter(row => row.some(Boolean));
        if (scoresRows.length < 2 || !scoresRows.slice(1).some(row => row[1] && row[3])) {
          throw new Error('Scores is unavailable. Import the schedule template before publishing.');
        }
        const scores = Tournament.readScores(snapshot.scores, rounds);
        if (scores.errors.length) throw new Error(scores.errors.join(' · '));
        status.textContent = [
          data.roster.length + ' people', data.teams.length + ' teams', rounds.length + ' rounds',
          scores.results.size + ' completed matches', ...data.warnings
        ].join(' · ');
        const key = await TournamentCrypto.importKey(snapshot.secret);
        const batch = crypto.randomUUID();
        const locked = snapshot.frozen || (scores.results.size ? fingerprint : '');
        const [roster, results] = await Promise.all([
          TournamentCrypto.seal(key, 'static', batch, snapshot.expires, snapshot.roster, locked),
          TournamentCrypto.seal(key, 'scores', batch, snapshot.expires, snapshot.scores, locked)
        ]);
        publish.disabled = false;
        publish.onclick = () => {
          publish.disabled = true;
          copy.disabled = true;
          status.textContent = 'Publishing…';
          google.script.run.withSuccessHandler(sha => {
            status.textContent = 'Published ' + sha.slice(0, 12);
          }).withFailureHandler(showError).publishTournament({
            sha: snapshot.sha, hash: snapshot.hash, roster, scores: results
          });
        };
      } catch (error) {
        showError(error);
      }
    }
    google.script.run.withSuccessHandler(prepare).withFailureHandler(showError).previewPublication();
  </script>
</body>
</html>
